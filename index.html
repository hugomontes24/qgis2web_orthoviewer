<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/svg+xml" href="assets/pictures/favicon.svg">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&display=swap" rel="stylesheet">
    <title>Iframe orthophotos</title>
</head>
<body>
<div class="main">

<div id="div-header">
    <div id="logo">
        <img src="assets/pictures/logo.svg" alt="logo">
    </div>
    <div data-mode="normal" class="mode timeline"></div><!-- timeline mode normal -->

    <!-- <div class="timeline mode_timelapse">  timeline mode_timelapse 
        
            <div class="div-timeline buttons" id="buttons">
                <div class="timeline-item"><div class="timeline-year">2023</div>
                <div class="timeline-dot">
                    <button id="2" class="button"></button>
                </div>
            </div>

    </div> -->

    <div class="compte"></div>
</div>

<div id="app">

    <div id="map_div">
        <!-- The map iframe will be here -->
        <iframe id="map_iframe" src="./qgis2web_V1/index.html" frameborder="0"></iframe>
        <div id="map-controls"> 
            <div class="div_micro">
                <button id="btn_micro" class="map-btn">🎤</button>
            </div>          
            <div class="b2d3d">
                <button id="btn-2d" class="map-btn active">2D</button>
                <button id="btn-3d" class="map-btn">3D</button>
            </div>

            <div class="div_filter">
                <button id="btn_filter" class="map-btn-filter">
                    <img src="assets/pictures/white-filter-50.png" alt="icone filtre" />
                </button>
                <div id="display_filter">
                    <label for="select_etat">État :</label>
                    <select id="select_etat">
                        <option value="-1" selected>Tous</option>
                        <option value="0">Normal</option>
                        <option value="1">À contrôler</option>
                        <option value="2">À risque</option>
                    </select>
                </div>
            </div>

            <div>
                <button id="btn_fullscreen" class="map-btn fullscreen_btn">
                    &#x26F6;
                </button>
            </div>
            
            
        </div>
    
    </div>

    <div id="sidebar_div" class="mode_home">
        
        <!-- <h3>Photo</h3> -->
        <div>
            <div class="pourcentage">
                <div class="div_etat">
                    <span id="span_normal" class="etat_color normal"></span>
                    <div>
                        <span id="span_normal_count"></span> % photos normales
                    </div>
                </div>
                <div class="div_etat">
                    <span id="span_attention" class="etat_color attention"></span>
                    <div>
                        <span id="span_attention_count"></span> % à controler
                    </div>
                </div>
                <div class="div_etat">
                    <span id="span_danger" class="etat_color danger"></span>
                    <div>
                        <span id="span_danger_count"></span> % à risque
                    </div>
                </div>



            </div>
            <div id="picture_container">
                <img id="chosen_picture" src="" alt="">   <!-- image border will be set in js "warning", "danger", "normal"-->
            </div>
            <div class="picture_detail">
                <div id="picture_name"></div>
                <div id="picture_description">
                    <p>Nom : <span id="photo_name"></span></p>
                    <p>Longitude : <span id="lng"></span></p>
                    <p>Latitude : <span id="lat"></span></p>
                    <p>A faire : <br>
                        <span id="p_description"></span>
                    </p>
                </div>

            </div>
            

        </div>
        
    </div>
    <!-- <div id="sidebar_div" class="mode_home">  Il y aura en js un changement de classe pour le mode_timelapse
        
            
    </div> -->

    

</div><!-- app end -->

        
</div><!-- main end -->
    
    <script src="qgis2web_V1/data/Photos_1.js"></script><!-- datas from map -->
    <script src="custom.js"></script>
    <!-- <script src="custom_buttons.js"></script> -->
    <script src="viewer.js"></script>
    <script src="methods.js"></script>
</body>
</html>
